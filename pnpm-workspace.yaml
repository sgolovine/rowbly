allowBuilds:
  esbuild: true
  "@google/genai": false
  protobufjs: false
  # agentic-tui's PTY. Its install script would compile from source; the prebuilt
  # binaries it ships load without it.
  node-pty: false
overrides:
  # node-pty 1.1.0 ships no Linux x64 binary; 1.2 ships one for every CI and dev platform.
  node-pty: 1.2.0-beta.15
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.5"
  - "@biomejs/cli-android-arm64@2.6.5"
  - "@biomejs/cli-android-x64@2.6.5"
  - "@biomejs/cli-darwin-arm64@2.6.5"
  - "@biomejs/cli-darwin-x64@2.6.5"
  - "@biomejs/cli-linux-arm64-musl@2.6.5"
  - "@biomejs/cli-linux-arm64@2.6.5"
  - "@biomejs/cli-linux-x64-musl@2.6.5"
  - "@biomejs/cli-linux-x64@2.6.5"
  - "@biomejs/cli-win32-arm64@2.6.5"
  - "@biomejs/cli-win32-x64@2.6.5"
  - "@earendil-works/pi-agent-core@1.5.2"
  - "@earendil-works/pi-ai@1.5.2"
  - "@earendil-works/pi-codemode@1.5.2"
  - "@earendil-works/pi-coding-agent@1.5.2"
  - "@earendil-works/pi-mcp@1.5.2"
  - "@earendil-works/pi-schema@1.5.2"
  - "@earendil-works/pi-telemetry@1.5.2"
  - "@earendil-works/pi-tui@1.5.2"
  - "typebox@1.4.7"
