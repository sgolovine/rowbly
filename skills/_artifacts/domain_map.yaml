# domain_map.yaml
# Library: rowbly
# Version: 0.1.0
# Date: 2026-10-18
# Status: draft (first batch: operating Rowbly as an agent)

library:
  name: rowbly
  version: 0.1.0
  repository: https://github.com/sgolovine/rowbly
  description: A developer-focused, file-backed Kanban tracker for the terminal (CLI and TUI).
  primary_framework: framework-agnostic

domains:
  - name: Running the CLI
    slug: cli-usage
    description: Shared rules for calling rowbly from an agent or script (resolution, flags, output, exit codes).
  - name: Setting up a Data Root
    slug: data-root-setup
    description: Creating and configuring the .rowbly/ Data Root, Boards, Assignees, Stages and Custom Fields.
  - name: Tracking work
    slug: work-tracking
    description: Day-to-day Story and Task work on a Board.
  - name: Plugins
    slug: plugins
    description: Turning Built-in Plugins on and off and using Epics, Specs and Comments.
  - name: Data integrity
    slug: data-integrity
    description: Checking and repairing the Data Root with doctor, mainly after git merges.

skills:
  - name: rowbly-cli
    slug: rowbly-cli
    domain: cli-usage
    type: core
    description: "Use first whenever an agent runs the rowbly command for a
      file-backed Kanban tracker (.rowbly/ folder): how Rowbly finds its Data Root
      and Board, how to run it non-interactively with --json, --no-prompt and --yes,
      how to read exit codes and JSON errors, and why not to open the TUI. Other
      rowbly-* skills build on it."
    covers: [Data Root discovery, --root / ROWBLY_ROOT, Board resolution, ROWBLY_BOARD, --json, --no-prompt, --yes, exit codes 0-6, JSON error shape, Data Root lock, glossary]
    tasks:
      - Run rowbly commands from an agent or script without hanging on prompts
      - Interpret rowbly exit codes and JSON errors and recover
      - Resolve which Data Root and Board a command acts on
    failure_modes:
      - mistake: Omitting --no-prompt in a pseudo-terminal shell
        mechanism: Rowbly prompts when stdin and stdout are terminals, so a missing value waits forever.
        wrong_pattern: rowbly stories create --board web
        correct_pattern: rowbly stories create --board web --name "Login" --json --no-prompt
        source: README.md#global-flags
        priority: HIGH
        status: active
      - mistake: Retrying a deterministic failure unchanged
        mechanism: Exit 2/3/4 come from the input; details lists valid choices.
        wrong_pattern: rerun the same command after exit 2
        correct_pattern: read error.details (validStages, validHandles) and change the input
        source: README.md#exit-codes
        priority: HIGH
        status: active
      - mistake: Pointing --root at the project folder
        mechanism: --root names the Data Root itself; a project folder acts as an empty Data Root.
        wrong_pattern: rowbly --root ~/code/app stories list
        correct_pattern: rowbly --root ~/code/app/.rowbly stories list
        source: observed with dist/cli.js at 2e488a8; test/skills/agentWorkflows.test.ts
        priority: MEDIUM
        status: active
      - mistake: Opening the TUI or $EDITOR from an agent
        mechanism: Bare rowbly and --edit wait for a person.
        wrong_pattern: rowbly stories edit WEB-1 --edit
        correct_pattern: rowbly stories edit WEB-1 --description-file - --json --no-prompt
        source: README.md#global-flags
        priority: HIGH
        status: active

  - name: rowbly-setup
    slug: rowbly-setup
    domain: data-root-setup
    type: lifecycle
    description: "Use when setting up or configuring Rowbly in a repository:
      creating the .rowbly/ Data Root with rowbly init, adding Boards and key
      prefixes, the Assignee roster and Me (whoami), the current Board (use), and
      changing Stages or Custom Fields at Board or global level through the
      Configuration Cascade. Not for day-to-day Story work (rowbly-stories)."
    covers: [init, use, whoami, config show, boards, assignees, stages, fields, Configuration Cascade, --level]
    tasks:
      - Create a Data Root and first Board in a project
      - Add Assignees and claim Me
      - Add, reorder or remove Stages and Custom Fields at the right Configuration Cascade level
    failure_modes:
      - mistake: Editing Stages at the wrong Configuration Cascade level
        mechanism: The default level is board when a Board resolves; the first board-level edit copies the list and stops inheriting global changes.
        wrong_pattern: rowbly stages add blocked --name Blocked --category in_progress
        correct_pattern: rowbly stages add blocked --name Blocked --category in_progress --level global
        source: README.md#configuration-cascade; docs/architecture/data-model.md#configuration-cascade
        priority: HIGH
        status: active
      - mistake: Running init under an existing Data Root
        mechanism: Discovery walks up; a nested .rowbly/ hides the parent one.
        wrong_pattern: cd app/sub && rowbly init
        correct_pattern: rowbly use --json --no-prompt  # exit 5 means none exists
        source: README.md#data-root-and-git-workflow
        priority: HIGH
        status: active
      - mistake: Removing a Custom Field or option that Stories use
        mechanism: fields remove/edit strips values that no longer fit from every affected Story.
        wrong_pattern: rowbly fields remove area
        correct_pattern: confirm with the user first
        source: README.md#custom-fields
        priority: MEDIUM
        status: active

  - name: rowbly-stories
    slug: rowbly-stories
    domain: work-tracking
    type: sub-skill
    description: "Use when tracking work in a Rowbly Data Root: finding, creating,
      editing, moving, ranking or deleting Stories (keys like WEB-42) and their
      Tasks (WEB-42.1), filtering stories list, setting Assignees, Priority, Labels,
      due dates and Custom Field values, or picking up and finishing a Story as an
      agent. Not for Board, Stage or Custom Field configuration (rowbly-setup)."
    covers: [stories list/show/create/edit/move/rank/delete, tasks list/show/create/edit/move/delete, Stage Category, --add-label, --add-assignee, --field]
    tasks:
      - Find the Stories to work on and read one in full
      - Create a Story or Task with valid Assignees, Priority, Labels and Custom Field values
      - Move a Story or Task through Stages and rank it as work progresses
    failure_modes:
      - mistake: Using --label or --assignee on edit to add one value
        mechanism: Those flags replace the list.
        wrong_pattern: rowbly stories edit WEB-1 --label needs-docs
        correct_pattern: rowbly stories edit WEB-1 --add-label needs-docs
        source: README.md#stories; test/skills/agentWorkflows.test.ts
        priority: HIGH
        status: active
      - mistake: Hard-coding done or in-progress Stage keys
        mechanism: Stages are configured per Board; choose by Stage Category.
        wrong_pattern: rowbly stories move WEB-1 done
        correct_pattern: read config show .stages and pick the first category done Stage
        source: README.md#stages; test/skills/agentWorkflows.test.ts
        priority: HIGH
        status: active
      - mistake: Title Case or spaced Labels
        mechanism: Labels must be lower-kebab-case; validation exits 2.
        wrong_pattern: --add-label "Needs Review"
        correct_pattern: --add-label needs-review
        source: docs/agents/CONTEXT.md (Label)
        priority: HIGH
        status: active
      - mistake: Predicting the next Story Key
        mechanism: Keys are highest plus one and may be reused or collide across branches.
        wrong_pattern: assume the new Story is WEB-8
        correct_pattern: read key from the create output
        source: README.md#stories
        priority: MEDIUM
        status: active

  - name: rowbly-plugins
    slug: rowbly-plugins
    domain: plugins
    type: sub-skill
    description: "Use when turning Rowbly Plugins on or off for a Data Root, editing
      Plugin settings, or using the Built-in Plugins' commands: Epics (rowbly epics,
      --epic), Specs (rowbly specs, --spec, Story and Board Specs) and Comments
      (rowbly comments). Also when a rowbly command is unknown because its Plugin is
      off, or a Plugin failed to load. Not for writing a new Plugin."
    covers: [plugins list/show/enable/disable, Plugin settings, epics, specs, comments, --epic, --spec, --add-spec, --reset-specs, PLUGIN_FAILED]
    tasks:
      - Turn a Built-in Plugin on or off and change its settings
      - Group Stories into Epics and check Epic Progress
      - Write Specs and link Stories to Board Specs
      - Comment on Stories and Tasks
    failure_modes:
      - mistake: Naming a Story Spec by slug
        mechanism: Story Keys are case-insensitive and web-42 is also a Board Spec slug.
        wrong_pattern: rowbly specs show web-42
        correct_pattern: rowbly specs show --story WEB-42
        source: docs/plugins/built-in.md#specs
        priority: HIGH
        status: active
      - mistake: Using --spec on edit to add one link
        mechanism: --spec replaces all links.
        wrong_pattern: rowbly stories edit WEB-1 --spec api
        correct_pattern: rowbly stories edit WEB-1 --add-spec api
        source: docs/plugins/built-in.md#specs
        priority: HIGH
        status: active
      - mistake: Turning a Plugin off to silence an error
        mechanism: Commands disappear but data and the problem remain.
        wrong_pattern: rowbly plugins disable epics
        correct_pattern: rowbly plugins list --json; rowbly doctor --json
        source: docs/plugins/README.md
        priority: MEDIUM
        status: active

  - name: rowbly-doctor
    slug: rowbly-doctor
    domain: data-integrity
    type: sub-skill
    description: "Use when a Rowbly Data Root may be inconsistent: after a git
      merge, pull or rebase that touched .rowbly/, when a rowbly command exits 6
      (DATA_INTEGRITY), when two branches created the same Story Key, or when files
      under .rowbly/ were edited by hand. Covers rowbly doctor, doctor --fix, its
      finding codes, and what must be repaired by hand."
    covers: [doctor, doctor --fix, DoctorReport, finding codes, STORY_KEY_CONFLICT, UNKNOWN_STAGE, CONFLICT_MARKERS, interrupted commits, LEGACY_DATA]
    reference_candidates:
      - topic: doctor finding codes
        reason: 25 codes with severity, fix behaviour and manual repair (references/finding-codes.md)
    tasks:
      - Check and repair the Data Root after merging branches
      - Resolve a Story Key conflict from two branches
      - Recover when a command exits 6 or a commit was interrupted
    failure_modes:
      - mistake: Resolving a Story Key add/add conflict by picking one side
        mechanism: One of the two Stories is lost; doctor --fix keeps both and renumbers.
        wrong_pattern: git checkout --ours .rowbly/boards/web/stories/WEB-7/story.json
        correct_pattern: rowbly doctor --fix --json --no-prompt
        source: README.md#doctor; test/commands/doctor.test.ts
        priority: HIGH
        status: active
      - mistake: Deleting a Story folder or .txn/ to clear an error
        mechanism: A folder without story.json still reserves its key; .txn/ may hold an interrupted commit.
        wrong_pattern: rm -rf .rowbly/.txn
        correct_pattern: rowbly doctor --fix
        source: docs/architecture/storage.md; README.md#doctor
        priority: CRITICAL
        status: active
      - mistake: Committing a merge before doctor exits 0
        mechanism: The conflict reaches everyone who pulls and blocks their commands with exit 6.
        wrong_pattern: git commit after an add/add conflict in .rowbly/
        correct_pattern: rowbly doctor --fix, then rowbly doctor (exit 0), then git add .rowbly && git commit
        source: README.md#data-root-and-git-workflow
        priority: HIGH
        status: active

tensions:
  - name: Shared configuration versus the request at hand
    skills: [rowbly-plugins, rowbly-setup]
    description: Plugin switches, Stages and Custom Fields live in committed files shared by every user of the Data Root.
    implication: An agent that only considers its task changes configuration for the whole team; the skills require user intent and reporting.
  - name: Local State versus explicit flags
    skills: [rowbly-cli, rowbly-stories]
    description: rowbly use and whoami write the developer's local.json.
    implication: Scripts should pass --board explicitly instead of changing the developer's context.

cross_references:
  - from: rowbly-stories
    to: rowbly-plugins
    reason: --epic, --spec and comments extend Story work when those Plugins are on.
  - from: rowbly-setup
    to: rowbly-doctor
    reason: Configuration changes (required fields, removed Stages) surface as doctor findings.
  - from: rowbly-cli
    to: rowbly-doctor
    reason: Exit 6 routes to doctor.

gaps:
  - skill: rowbly-plugin-authoring
    question: Should a skill cover writing a Built-in Plugin (docs/plugins/writing-a-plugin.md, api.md)?
    context: Out of scope for this batch (operating Rowbly); third-party Plugins are planned, not built.
    status: open
  - skill: rowbly-cli
    question: Should agents ever drive the TUI (e.g. for Actions, which are TUI-only per ADR-0017)?
    context: The batch tells agents to use command mode only; Plugin Actions have no CLI equivalent for non-data behaviour.
    status: open
